<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Les trois points d un arc movc">
<title>Ce que movc demande</title>
<rect width="760" height="430" fill="#fdfcf7"/>
<text x="40.0" y="42.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#333" text-anchor="start">ce que <tspan font-style="italic">movc</tspan> demande, et dans quel ordre</text>
<text x="40.0" y="64.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">trois points font un arc &#183; deux seulement se d&#233;clarent</text>
<path d="M 80.0 330.0 A 170.0 170.0 0 0 1 250.0 160.0" fill="none" stroke="#333" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="250.0" cy="330.0" r="170.0" fill="none" stroke="#9aa2ae" stroke-width="1" stroke-dasharray="4 5"/>
<line x1="250.0" y1="330.0" x2="80.0" y2="330.0" stroke="#9aa2ae" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="250.0" y1="330.0" x2="129.8" y2="209.8" stroke="#9aa2ae" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="250.0" y1="330.0" x2="250.0" y2="160.0" stroke="#9aa2ae" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="250.0" cy="330.0" r="4" fill="none" stroke="#9aa2ae" stroke-width="1.6"/>
<line x1="241.0" y1="321.0" x2="259.0" y2="339.0" stroke="#9aa2ae" stroke-width="1.6"/>
<line x1="241.0" y1="339.0" x2="259.0" y2="321.0" stroke="#9aa2ae" stroke-width="1.6"/>
<text x="268.0" y="335.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#9aa2ae" text-anchor="start">le centre du cercle</text>
<text x="268.0" y="351.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#9aa2ae" text-anchor="start">ne se d&#233;clare PAS</text>
<circle cx="80.0" cy="330.0" r="7" fill="#9aa2ae"/>
<circle cx="80.0" cy="330.0" r="13" fill="none" stroke="#9aa2ae" stroke-width="1.6"/>
<text x="80.0" y="310.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#9aa2ae" text-anchor="middle">1</text>
<text x="100.0" y="331.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#9aa2ae" text-anchor="start">l&#224; o&#249; l&#8217;on est d&#233;j&#224;</text>
<text x="100.0" y="347.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">la fin du mouvement pr&#233;c&#233;dent</text>
<circle cx="129.8" cy="209.8" r="7" fill="#c8792a"/>
<circle cx="129.8" cy="209.8" r="13" fill="none" stroke="#c8792a" stroke-width="1.6"/>
<text x="129.8" y="189.8" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#c8792a" text-anchor="middle">2</text>
<text x="149.8" y="210.8" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c8792a" text-anchor="start">le point de passage</text>
<text x="149.8" y="226.8" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">1<tspan baseline-shift="super" font-size="9">er</tspan> argument</text>
<circle cx="250.0" cy="160.0" r="7" fill="#c0392b"/>
<circle cx="250.0" cy="160.0" r="13" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="250.0" y="140.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">3</text>
<text x="270.0" y="161.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="start">la cible</text>
<text x="270.0" y="177.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">2<tspan baseline-shift="super" font-size="9">e</tspan> argument</text>
<rect x="36" y="346" width="470" height="44" rx="6" fill="#f2efe6" stroke="#ddd8c8" stroke-width="1"/>
<text x="56" y="374" font-family="Cascadia Mono, Consolas, monospace" font-size="15" fill="#333">robot.movc(<tspan fill="#c8792a" font-weight="700">point de passage</tspan>, <tspan fill="#c0392b" font-weight="700">cible</tspan>)</text>
<text x="524.0" y="368.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">le point 1 n&#8217;y figure pas&#160;:</text>
<text x="524.0" y="384.0" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">le robot y est d&#233;j&#224;.</text>
